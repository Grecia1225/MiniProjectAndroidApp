name: mtc
description: Marine Trade Connect

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  image_picker: ^1.2.3
  firebase_storage: ^12.4.10
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  provider: ^6.1.1
  intl: ^0.20.2
  url_launcher: ^6.2.6
  cached_network_image: ^3.3.1
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/theme_navy_gold.jpg
    - assets/images/theme_midnight_cyan.jpg
    - assets/images/theme_ocean_green.jpg
    - assets/images/theme_deep_blue.jpg
    - assets/images/theme_coral_sunset.jpg